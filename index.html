<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>ASU Outreach Hub Projects (Dark)</title>

  <style>
    :root{
      --asu-maroon:#8C1D40;
      --asu-gold:#FFC627;

      --bg-1:#0b0c10;
      --bg-2:#12131a;

      --text:#f3f4f6;
      --muted:rgba(243,244,246,.75);

      --gold-border:rgba(255,198,39,.55);
      --gold-border-strong:rgba(255,198,39,.80);
      --row-border:rgba(255,198,39,.22);

      --shadow: 0 10px 26px rgba(0,0,0,.55);
      --glow: 0 0 0 1px rgba(255,198,39,.25), 0 0 22px rgba(255,198,39,.10);

      --bg0:#0b0f17;
      --bg1:#0f1320;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      background:
        radial-gradient(900px 420px at 10% 0%, rgba(140,29,64,.45), transparent 60%),
        radial-gradient(820px 380px at 95% 12%, rgba(255,198,39,.28), transparent 62%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
    }

    .wrap{
      padding:8px;
    }

    .stack{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .bar,
    .lane{
      border-radius:14px;
      border:1px solid var(--gold-border);
      background:
        linear-gradient(180deg, rgba(140,29,64,.26), rgba(0,0,0,.10)),
        linear-gradient(180deg, var(--bg-2), var(--bg-1));
      box-shadow:var(--shadow), var(--glow);
    }

    .bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .badge{
      width:10px;
      height:10px;
      border-radius:999px;
      background:var(--asu-gold);
      box-shadow:0 0 0 3px rgba(255,198,39,.18);
      flex:0 0 auto;
    }

    .brandtext{
      display:flex;
      flex-direction:column;
      line-height:1.05;
      min-width:0;
    }

    .brandtext .t{
      font-weight:850;
      font-size:12.5px;
      letter-spacing:.3px;
      color:var(--text);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brandtext .s{
      margin-top:3px;
      font-size:11px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .meta{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid var(--row-border);
      background:linear-gradient(90deg, rgba(140,29,64,.28), rgba(0,0,0,.15));
      color:var(--text);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    .board{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .top-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:10px;
      align-items:start;
    }

    .bottom-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:10px;
    }

    .lane{
      padding:10px;
      min-height:220px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .lane-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding-bottom:8px;
      border-bottom:1px solid rgba(255,198,39,.18);
    }

    .lane-title{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .lane-title .dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:var(--asu-gold);
      opacity:.95;
      flex:0 0 auto;
    }

    .lane-title .text{
      font-weight:850;
      font-size:13px;
      letter-spacing:.25px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .count{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:26px;
      height:26px;
      padding:0 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      font-size:12px;
      font-weight:900;
      color:var(--text);
      flex:0 0 auto;
    }

    .lane-items{
      display:flex;
      flex-direction:column;
      gap:8px;
      min-height:40px;
    }

    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--row-border);
      background:linear-gradient(90deg, rgba(140,29,64,.28), rgba(0,0,0,.15));
      color:var(--text);
      text-decoration:none;
      transition:transform .10s ease, border-color .12s ease, background .12s ease;
    }

    .item:hover{
      transform:translateY(-1px);
      border-color:var(--gold-border-strong);
      background:linear-gradient(90deg, rgba(140,29,64,.36), rgba(0,0,0,.20));
    }

    .left{
      display:flex;
      align-items:flex-start;
      gap:8px;
      min-width:0;
      flex:1 1 auto;
    }

    .icon{
      width:22px;
      height:22px;
      border-radius:10px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      flex:0 0 auto;
      font-size:13px;
      line-height:1;
      margin-top:1px;
    }

    .copy{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:0;
    }

    .label{
      font-weight:800;
      font-size:13px;
      line-height:1.25;
      overflow:hidden;
      text-overflow:ellipsis;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
    }

    .sub{
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
      font-size:11px;
      color:var(--muted);
    }

    .tag{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:3px 7px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.05);
      color:var(--muted);
      white-space:nowrap;
    }

    .actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
    }

    .open{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:32px;
      padding:7px 12px;
      border-radius:12px;
      background:linear-gradient(180deg, #FFE08A, var(--asu-gold));
      color:#111;
      font-weight:900;
      font-size:12px;
      letter-spacing:.2px;
      border:1px solid rgba(0,0,0,.18);
      box-shadow:0 6px 14px rgba(0,0,0,.35);
      text-decoration:none;
      white-space:nowrap;
      flex:0 0 auto;
    }

    .empty,
    .state,
    .error{
      padding:12px;
      border-radius:14px;
      border:1px dashed rgba(255,198,39,.25);
      background:rgba(255,255,255,.03);
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }

    .state,
    .error{
      border-style:solid;
    }

    .error{
      border-color:rgba(255,120,120,.35);
      color:#ffd6d6;
      background:rgba(120,0,0,.10);
    }

    @media (max-width:1200px){
      .top-grid{grid-template-columns:repeat(2, minmax(0, 1fr));}
    }

    @media (max-width:760px){
      .wrap{padding:6px;}
      .bar{padding:9px;}
      .top-grid,
      .bottom-grid{grid-template-columns:1fr;}
      .item{padding:9px 10px; align-items:flex-start;}
      .actions{align-self:center;}
      .brand{width:100%;}
      .meta{justify-content:flex-start;}
    }
  </style>

  <script>
    (function () {
      try {
        const u = new URL(window.location.href);
        if (!u.searchParams.has("v")) {
          u.searchParams.set("v", Date.now().toString());
          window.location.replace(u.toString());
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div class="wrap">
    <div class="stack">
      <div class="bar">
        <div class="brand" aria-hidden="true">
          <div class="badge"></div>
          <div class="brandtext">
            <div class="t">ASU Outreach Hub</div>
            <div class="s" id="subtitle">Projects grouped by OH project workflow status</div>
          </div>
        </div>

        <div class="meta" id="meta">
          <span class="pill">Loading projects…</span>
        </div>
      </div>

      <div class="board">
        <div id="statusMessage" class="state">Loading project groups…</div>

        <div class="top-grid" id="topGrid" hidden></div>
        <div class="bottom-grid" id="bottomGrid" hidden></div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_API_URL = ""; // Optional: paste your Worker /api/projects URL here if this file is hosted on GitHub Pages.

    const TOP_GROUPS = [
      { key: "planning", title: "Planning", icon: "🗂️" },
      { key: "execution", title: "Execution", icon: "🚀" },
      { key: "reporting", title: "Reporting", icon: "📊" },
      { key: "onHold", title: "On Hold", icon: "⏸️" }
    ];

    const BOTTOM_GROUPS = [
      { key: "completed", title: "Completed", icon: "✅" },
      { key: "cancelled", title: "Cancelled", icon: "⛔" }
    ];

    function getApiUrl() {
      const u = new URL(window.location.href);
      const qpApi = u.searchParams.get("api");
      if (qpApi) return qpApi;
      if (DEFAULT_API_URL) return DEFAULT_API_URL;
      return "/api/projects";
    }

    function buildApiUrl() {
      const api = new URL(getApiUrl(), window.location.href);
      const page = new URL(window.location.href);

      const passthrough = [
        "spaceId",
        "portfolioFolderId",
        "pmField",
        "pmMatchName",
        "dateField",
        "locationField",
        "workflowName",
        "debug"
      ];

      for (const key of passthrough) {
        const value = page.searchParams.get(key);
        if (value) api.searchParams.set(key, value);
      }

      api.searchParams.set("_", Date.now().toString());
      return api.toString();
    }

    function formatDate(iso) {
      if (!iso) return "No due date";
      const d = new Date(iso + "T00:00:00");
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleDateString(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderMeta(data) {
      const meta = document.getElementById("meta");
      const counts = data.counts || {};
      const total = (data.projects || []).length;
      const activeTotal =
        (counts.planning || 0) +
        (counts.execution || 0) +
        (counts.reporting || 0) +
        (counts.onHold || 0);

      meta.innerHTML = [
        `<span class="pill">PM: ${escapeHtml(data.matchTarget || data.user?.name || "Dustin Smith")}</span>`,
        `<span class="pill">Visible: ${total}</span>`,
        `<span class="pill">Open / Deferred: ${activeTotal}</span>`,
        `<span class="pill">Completed: ${counts.completed || 0}</span>`,
        `<span class="pill">Cancelled: ${counts.cancelled || 0}</span>`
      ].join("");
    }

    function renderLane(def, items) {
      const lane = document.createElement("section");
      lane.className = "lane";
      lane.innerHTML = `
        <div class="lane-head">
          <div class="lane-title">
            <span class="dot"></span>
            <span class="text">${escapeHtml(def.title)}</span>
          </div>
          <span class="count">${items.length}</span>
        </div>
        <div class="lane-items"></div>
      `;

      const itemsEl = lane.querySelector(".lane-items");

      if (!items.length) {
        itemsEl.innerHTML = `<div class="empty">No ${escapeHtml(def.title.toLowerCase())} projects right now.</div>`;
        return lane;
      }

      for (const item of items) {
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = `
          <div class="left">
            <span class="icon">${escapeHtml(def.icon)}</span>
            <div class="copy">
              <div class="label">${escapeHtml(item.title || "(Untitled)")}</div>
              <div class="sub">
                <span class="tag">${escapeHtml(item.status || def.title)}</span>
                <span class="tag">${escapeHtml(formatDate(item.dueDate))}</span>
              </div>
            </div>
          </div>
          <div class="actions">
            <a class="open" href="${escapeHtml(item.openUrl || "#")}" target="_top" rel="noopener">Open</a>
          </div>
        `;
        itemsEl.appendChild(row);
      }

      return lane;
    }

    function normalizeKey(key) {
      if (key === "onhold") return "onHold";
      if (key === "complete") return "completed";
      return key;
    }

    function ensureGroups(data) {
      const existing = data.groupedProjects || {};
      return {
        planning: existing.planning || [],
        execution: existing.execution || [],
        reporting: existing.reporting || [],
        onHold: existing.onHold || existing.onhold || [],
        completed: existing.completed || existing.complete || [],
        cancelled: existing.cancelled || []
      };
    }

    async function loadProjects() {
      const statusMessage = document.getElementById("statusMessage");
      const subtitle = document.getElementById("subtitle");
      const topGrid = document.getElementById("topGrid");
      const bottomGrid = document.getElementById("bottomGrid");

      try {
        const res = await fetch(buildApiUrl(), {
          method: "GET",
          headers: { "Accept": "application/json" },
          cache: "no-store"
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data?.error || `Request failed with ${res.status}`);
        }

        const groups = ensureGroups(data);

        subtitle.textContent = `Projects for ${data.matchTarget || data.user?.name || "Dustin Smith"} grouped by OH project workflow status`;
        renderMeta(data);

        topGrid.innerHTML = "";
        bottomGrid.innerHTML = "";

        TOP_GROUPS.forEach((def) => {
          topGrid.appendChild(renderLane(def, groups[def.key] || []));
        });

        BOTTOM_GROUPS.forEach((def) => {
          bottomGrid.appendChild(renderLane(def, groups[def.key] || []));
        });

        statusMessage.hidden = true;
        topGrid.hidden = false;
        bottomGrid.hidden = false;
      } catch (err) {
        statusMessage.className = "error";
        statusMessage.textContent =
          "Could not load projects. " +
          (err && err.message ? err.message : String(err));
      }
    }

    loadProjects();
  </script>
</body>
</html>
